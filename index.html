<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAUC PB &mdash; Painel de Regularidade</title>
<style>
  :root {
    --bg:      #F5EDE0;
    --card:    #FFFDF8;
    --card2:   #F0E4D0;
    --primary: #B8782A;
    --prim2:   #C8922A;
    --gold:    #D4B06A;
    --beige:   #E8D5B0;
    --green:   #2D7A4F;
    --orange:  #C05A00;
    --red:     #A8261A;
    --text:    #2C1A08;
    --muted:   #8C6D3F;
    --border:  #DEC99A;
    --shadow:  0 2px 12px rgba(100,60,10,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #7A4A10 0%, var(--primary) 60%, var(--prim2) 100%);
    padding: 18px 32px; display: flex; align-items: center; gap: 16px;
    box-shadow: 0 2px 10px rgba(100,50,0,0.25);
  }
  header .logo { font-size: 1.8rem; filter: brightness(1.3); }
  header h1 { font-size: 1.4rem; font-weight: 800; color: #FFF8F0; letter-spacing: .3px; }
  header p  { font-size: 0.78rem; color: #F0D9B8; margin-top: 2px; }
  .header-badge {
    background: rgba(255,255,255,0.22); color: #FFF8F0; font-size: 0.68rem;
    font-weight: 800; padding: 2px 9px; border-radius: 20px; margin-left: 8px;
    vertical-align: middle; border: 1px solid rgba(255,255,255,0.3);
  }
  header .updated { margin-left: auto; font-size: 0.72rem; color: #F0D9B8; text-align: right; line-height: 1.6; }
  header .updated strong { color: #FFF8F0; }

  /* ── UPDATE BUTTON ── */
  .btn-update {
    margin-left: 12px; padding: 8px 18px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.12); color: #FFF8F0; font-size: 0.82rem; font-weight: 700;
    cursor: pointer; transition: all .2s; white-space: nowrap; letter-spacing: .3px;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-update:hover:not(:disabled) { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.6); }
  .btn-update:disabled { opacity: .55; cursor: not-allowed; }
  .btn-update.loading { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    padding: 12px 20px; border-radius: 10px; font-size: 0.84rem; font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2); display: none;
    max-width: 340px; line-height: 1.4;
  }
  #toast.ok  { background: #F0FFF6; border: 1px solid #6EE7B7; color: #065F46; }
  #toast.err { background: #FFF0F0; border: 1px solid #FCA5A5; color: #7F1D1D; }
  #toast.show { display: block; animation: slideIn .3s ease; }
  @keyframes slideIn { from { transform: translateY(12px); opacity:0 } to { transform: translateY(0); opacity:1 } }

  /* ── LAYOUT ── */
  main { padding: 24px 32px; max-width: 1440px; margin: 0 auto; }

  /* ── KPI CARDS ── */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi-card {
    background: var(--card); border-radius: 12px; padding: 18px 20px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
    border-top: 3px solid var(--primary);
    display: flex; flex-direction: column; gap: 5px;
  }
  .kpi-card.danger { border-top-color: var(--red); }
  .kpi-card.warn   { border-top-color: var(--orange); }
  .kpi-card.ok     { border-top-color: var(--green); }
  .kpi-card .label {
    font-size: 0.67rem; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: .7px;
  }
  .kpi-card .value { font-size: 2.2rem; font-weight: 800; line-height: 1; color: var(--primary); }
  .kpi-card.danger .value { color: var(--red); }
  .kpi-card.ok     .value { color: var(--green); }
  .kpi-card.warn   .value { color: var(--orange); }
  .kpi-card .sub   { font-size: 0.72rem; color: var(--muted); }

  /* ── SEARCH BAR ── */
  .search-bar {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 18px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    box-shadow: var(--shadow);
  }
  .search-bar input {
    flex: 1; min-width: 160px; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; font-size: 0.88rem; outline: none; transition: border .2s;
    background: var(--bg); color: var(--text);
  }
  .search-bar input::placeholder { color: var(--muted); }
  .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(184,120,42,0.12); }
  .filter-pill {
    border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px;
    font-size: 0.78rem; cursor: pointer; background: var(--card2); color: var(--muted);
    transition: all .2s; font-weight: 600;
  }
  .filter-pill.active { background: var(--primary); color: #FFF8F0; border-color: var(--primary); }
  .filter-pill:hover:not(.active) { border-color: var(--primary); color: var(--primary); }
  .filter-count { font-size: 0.73rem; color: var(--muted); margin-left: auto; white-space: nowrap; }

  /* ── SECTION TITLE ── */
  .section-title {
    font-size: 0.72rem; font-weight: 700; color: var(--muted); margin-bottom: 14px;
    text-transform: uppercase; letter-spacing: .9px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── MUNICIPALITY GRID ── */
  .muni-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
    gap: 10px; margin-bottom: 28px;
  }
  .muni-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; cursor: pointer; border-left: 3px solid var(--gold);
    transition: all .18s; display: flex; flex-direction: column; gap: 6px;
    box-shadow: var(--shadow);
  }
  .muni-card:hover { transform: translateY(-2px); border-left-color: var(--primary); box-shadow: 0 6px 20px rgba(184,120,42,0.18); }
  .muni-card.has-issues { border-left-color: var(--red); }
  .muni-card.has-issues:hover { box-shadow: 0 6px 20px rgba(168,38,26,0.18); }
  .muni-card.is-ok      { border-left-color: var(--green); }
  .muni-card.is-ok:hover { box-shadow: 0 6px 20px rgba(45,122,79,0.18); }
  .muni-name { font-size: 0.82rem; font-weight: 700; color: var(--text); line-height: 1.3; }
  .muni-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 0.68rem;
    font-weight: 700; padding: 2px 8px; border-radius: 10px; width: fit-content;
  }
  .muni-badge.bad { background: rgba(168,38,26,0.12); color: var(--red); border: 1px solid rgba(168,38,26,0.2); }
  .muni-badge.ok  { background: rgba(45,122,79,0.10); color: var(--green); border: 1px solid rgba(45,122,79,0.2); }
  .muni-info { font-size: 0.66rem; color: var(--muted); }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(44,26,8,0.55); backdrop-filter: blur(3px);
    z-index: 1000; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; animation: fadeIn .18s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.97) } to { opacity: 1; transform: scale(1) } }

  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    width: 100%; max-width: 920px; max-height: 90vh; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 24px 80px rgba(100,50,0,0.35);
  }
  .modal-header {
    background: linear-gradient(135deg, #7A4A10 0%, var(--primary) 100%);
    padding: 20px 24px; display: flex; align-items: flex-start; gap: 12px;
  }
  .modal-header h2 { font-size: 1.2rem; font-weight: 800; color: #FFF8F0; }
  .modal-header p  { font-size: 0.78rem; color: #F0D9B8; margin-top: 3px; }
  .modal-close {
    margin-left: auto; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
    color: #FFF8F0; width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
    font-size: 1rem; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all .2s;
  }
  .modal-close:hover { background: rgba(168,38,26,0.5); border-color: var(--red); }

  .modal-summary {
    padding: 14px 24px; background: var(--card2);
    border-bottom: 1px solid var(--border); display: flex; gap: 32px; flex-wrap: wrap;
  }
  .modal-stat { display: flex; flex-direction: column; }
  .modal-stat .ms-val { font-size: 1.6rem; font-weight: 800; }
  .modal-stat .ms-val.red   { color: var(--red); }
  .modal-stat .ms-val.green { color: var(--green); }
  .modal-stat .ms-val.gray  { color: var(--muted); }
  .modal-stat .ms-lbl { font-size: 0.67rem; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-top: 1px; }

  .modal-body { overflow-y: auto; flex: 1; }

  /* ── ATTRIBUTE TABLE ── */
  .attr-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  .attr-table thead { position: sticky; top: 0; z-index: 2; }
  .attr-table th {
    background: var(--card2); color: var(--muted); padding: 10px 16px; text-align: left;
    font-size: 0.69rem; font-weight: 700; letter-spacing: .5px;
    border-bottom: 2px solid var(--border);
  }
  .attr-table td {
    padding: 9px 16px; border-bottom: 1px solid var(--beige);
    color: var(--text); vertical-align: middle;
  }
  .attr-table tbody tr:hover td { background: #FDF5EA; }
  .attr-table .group-header td {
    background: #F0E2C8; color: var(--primary); padding: 7px 16px;
    font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .7px;
    border-bottom: 1px solid var(--border); border-top: 1px solid var(--border);
  }
  .attr-code { color: var(--primary); font-size: 0.7rem; font-weight: 800; margin-right: 4px; }

  /* ── STATUS BADGES ── */
  .sbadge {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
    border-radius: 20px; font-size: 0.72rem; font-weight: 700; white-space: nowrap;
  }
  .sbadge.vencido  { background: rgba(168,38,26,0.12); color: var(--red);    border: 1px solid rgba(168,38,26,0.25); }
  .sbadge.ok       { background: rgba(45,122,79,0.10); color: var(--green);  border: 1px solid rgba(45,122,79,0.25); }
  .sbadge.hoje     { background: rgba(192,90,0,0.12);  color: var(--orange); border: 1px solid rgba(192,90,0,0.25); }
  .sbadge.urgente  { background: rgba(192,90,0,0.10);  color: var(--orange); border: 1px solid rgba(192,90,0,0.2); }
  .sbadge.desab    { background: rgba(140,109,63,0.08);color: var(--muted);  border: 1px solid var(--border); }

  .days-pill {
    display: inline-block; font-size: 0.65rem; background: rgba(184,120,42,0.12);
    color: var(--primary); border-radius: 6px; padding: 1px 6px; margin-left: 5px;
    border: 1px solid rgba(184,120,42,0.2);
  }
  .days-pill.soon { background: rgba(192,90,0,0.1); color: var(--orange); border-color: rgba(192,90,0,0.2); }
  .prazo-vencido { color: var(--red); font-weight: 700; }
  .prazo-hoje    { color: var(--orange); }
  .prazo-soon    { color: var(--orange); }
  .prazo-ok      { color: var(--muted); }
  small { font-size: 0.64rem; display: block; opacity: .75; margin-top: 1px; }

  /* ── EMPTY / FOOTER ── */
  .empty { text-align: center; padding: 48px; color: var(--muted); font-size: 0.9rem; }
  footer {
    text-align: center; padding: 16px; font-size: 0.7rem; color: var(--muted);
    border-top: 1px solid var(--border); margin-top: 8px;
  }
  footer strong { color: var(--primary); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

  @media (max-width: 600px) {
    main { padding: 14px; } header { padding: 14px 16px; }
    .muni-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    header h1 { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">&#127963;</div>
  <div>
    <h1>CAUC <span class="header-badge">PB</span></h1>
    <p>Cadastro &Uacute;nico de Conv&ecirc;nios &bull; Painel de Regularidade Municipal &bull; Para&iacute;ba</p>
  </div>
  <div class="updated" id="updatedAt"></div>
  <button class="btn-update" id="btnUpdate" onclick="atualizarDados()" title="Busca dados novos do banco e publica no GitHub">
    &#8635; Atualizar Dados
  </button>
</header>

<main>
  <div class="kpi-row" id="kpiRow"></div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="&#128269; Buscar munic&iacute;pio&hellip;" oninput="filterMunicipios()">
    <button class="filter-pill active" id="pill-all"    onclick="setFilter('all')">Todos</button>
    <button class="filter-pill"        id="pill-issues" onclick="setFilter('issues')">Com pend&ecirc;ncias</button>
    <button class="filter-pill"        id="pill-ok"     onclick="setFilter('ok')">Regulares</button>
    <span class="filter-count" id="filterCount"></span>
  </div>

  <div class="section-title">Munic&iacute;pios &mdash; clique para ver detalhes</div>
  <div class="muni-grid" id="muniGrid"></div>
  <div class="empty" id="emptyMsg" style="display:none">Nenhum munic&iacute;pio encontrado.</div>
</main>

<footer>
  Dados da view <strong>Cauc_pb</strong> &bull; Banco <strong>dw</strong> &bull;
  Gerado em <span id="footerDate"></span>
</footer>

<!-- MODAL -->
<div id="toast"></div>

<div class="modal-overlay" id="modalOverlay" onclick="bgClose(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h2 id="modalTitle"></h2>
        <p id="modalSubtitle"></p>
      </div>
      <button class="modal-close" onclick="closeModal()" title="Fechar (Esc)">&#10005;</button>
    </div>
    <div class="modal-summary" id="modalSummary"></div>
    <div class="modal-body">
      <table class="attr-table">
        <thead>
          <tr>
            <th style="width:52%">Atributo</th>
            <th style="width:20%">Status</th>
            <th style="width:28%">Prazo / Situa&ccedil;&atilde;o</th>
          </tr>
        </thead>
        <tbody id="modalBody"></tbody>
      </table>
    </div>
  </div>
</div>

var TODAY = new Date(); TODAY.setHours(0,0,0,0);

var GROUPS = [
  { key: '1.', label: 'Grupo 1 — Regularidade Federal' },
  { key: '2.', label: 'Grupo 2 — Cadastros' },
  { key: '3.', label: 'Grupo 3 — Transparência Fiscal' },
  { key: '4.', label: 'Grupo 4 — Tributação e Previdência' },
  { key: '5.', label: 'Grupo 5 — Aplicações Mínimas' }
];

/* ── helpers ── */
function parseDate(s) {
  var m = s && s.match(/^(\d{2})\/(\d{2})\/(\d{2})$/);
  if (!m) return null;
  return new Date(parseInt(m[3]) + 2000, parseInt(m[2]) - 1, parseInt(m[1]));
}
function daysLeft(s) {
  var d = parseDate(s);
  return d ? Math.round((d - TODAY) / 86400000) : null;
}
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* Municipio irregular = somente valor='!' */
function isPendente(valor) {
  return valor === '!';
}

/* ── index by municipio ── */
var byMuni = {};
RAW.forEach(function(r) {
  if (!byMuni[r.municipio]) byMuni[r.municipio] = [];
  byMuni[r.municipio].push(r);
});
var municipios = Object.keys(byMuni).sort(function(a,b){ return a.localeCompare(b,'pt-BR'); });

/* ── KPIs ── */
function renderKPIs() {
  var total = municipios.length, withIssue = 0, allOk = 0, totalPend = 0, soon = 0;
  municipios.forEach(function(m) {
    var rows = byMuni[m];
    var bad = rows.filter(function(r){ return isPendente(r.valor); }).length;
    if (bad) withIssue++; else allOk++;
    totalPend += bad;
    rows.forEach(function(r) {
      var dl = daysLeft(r.valor);
      if (dl !== null && dl >= 0 && dl <= 7) soon++;
    });
  });
  var pct = ((withIssue / total) * 100).toFixed(1);
  document.getElementById('kpiRow').innerHTML = [
    kpiCard('', 'Total de Municípios PB', total, 'analisados neste painel'),
    kpiCard('danger', 'Com Pendências', withIssue, pct + '% dos municípios'),
    kpiCard('', 'Total de Certidões Irregulares', totalPend, 'vencidas ou não emitidas'),
    kpiCard('ok', 'Municípios Regulares', allOk, 'sem nenhuma pendência'),
    kpiCard('warn', 'Vencendo em 7 dias', soon, 'certidões próximas do prazo')
  ].join('');
}
function kpiCard(cls, lbl, val, sub) {
  return '<div class="kpi-card ' + cls + '"><span class="label">' + lbl +
    '</span><span class="value">' + val + '</span><span class="sub">' + sub + '</span></div>';
}

/* ── status badge ── */
function statusBadge(valor) {
  if (valor === '!') return '<span class="sbadge vencido">&#9888; Irregular</span>';
  if (!valor || valor === 'Desabilitado') return '<span class="sbadge desab">— Desab.</span>';
  var dl = daysLeft(valor);
  if (dl === null) return '<span class="sbadge desab">' + esc(valor) + '</span>';
  if (dl < 0)  return '<span class="sbadge vencido">&#9888; Vencido</span>';
  if (dl === 0) return '<span class="sbadge hoje">&#9200; Hoje</span>';
  if (dl <= 7) return '<span class="sbadge urgente">&#9889; ' + dl + 'd</span>';
  return '<span class="sbadge ok">&#10004; Regular</span>';
}

/* ── prazo text ── */
function prazoText(valor) {
  if (valor === '!') return '<span class="prazo-vencido">Não emitida</span>';
  if (!valor || valor === 'Desabilitado') return '<span style="color:var(--muted)">—</span>';
  var dl = daysLeft(valor);
  if (dl === null) return '<span class="prazo-ok">' + esc(valor) + '</span>';
  if (dl < 0)  return '<span class="prazo-vencido">' + esc(valor) + '<small>há ' + Math.abs(dl) + ' dia' + (Math.abs(dl)>1?'s':'') + '</small></span>';
  if (dl === 0) return '<span class="prazo-hoje">' + esc(valor) + '<small>vence hoje</small></span>';
  if (dl <= 7) return '<span class="prazo-soon">' + esc(valor) + '<span class="days-pill soon">' + dl + 'd</span></span>';
  return '<span class="prazo-ok">' + esc(valor) + '<span class="days-pill">' + dl + 'd</span></span>';
}

/* ── grid filter ── */
var curFilter = 'all', curSearch = '';

function setFilter(f) {
  curFilter = f;
  ['all','issues','ok'].forEach(function(x) {
    document.getElementById('pill-'+x).classList.toggle('active', x === f);
  });
  renderGrid();
}
function filterMunicipios() {
  curSearch = document.getElementById('searchInput').value.toLowerCase();
  renderGrid();
}
function filtered() {
  return municipios.filter(function(m) {
    var bad = byMuni[m].some(function(r){ return isPendente(r.valor); });
    var matchF = curFilter === 'all' || (curFilter === 'issues' && bad) || (curFilter === 'ok' && !bad);
    var matchS = !curSearch || m.toLowerCase().indexOf(curSearch) !== -1;
    return matchF && matchS;
  });
}

function renderGrid() {
  var list = filtered();
  document.getElementById('filterCount').textContent = list.length + ' município' + (list.length !== 1 ? 's' : '');
  var grid = document.getElementById('muniGrid');
  var empty = document.getElementById('emptyMsg');
  if (!list.length) { grid.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';

  grid.innerHTML = list.map(function(m) {
    var globalIdx = municipios.indexOf(m);
    var rows  = byMuni[m];
    var issues = rows.filter(function(r){ return isPendente(r.valor); }).length;
    var total  = rows.filter(function(r){ return r.valor !== 'Desabilitado'; }).length;
    var cls    = issues ? 'has-issues' : 'is-ok';
    return '<div class="muni-card ' + cls + '" onclick="openModal(' + globalIdx + ')">' +
      '<div class="muni-name">' + esc(m) + '</div>' +
      '<div class="muni-badge ' + (issues ? 'bad' : 'ok') + '">' +
        (issues ? '&#9888; ' + issues + ' pendência' + (issues > 1 ? 's' : '') : '&#10004; Regular') +
      '</div>' +
      '<div class="muni-info">' + total + ' certidões</div>' +
      '</div>';
  }).join('');
}

/* ── modal ── */
function openModal(idx) {
  var municipio = municipios[idx];
  var rows = byMuni[municipio];
  var issues   = rows.filter(function(r){ return isPendente(r.valor); }).length;
  var vencidos = rows.filter(function(r){ var dl=daysLeft(r.valor); return !isPendente(r.valor) && dl !== null && dl < 0; }).length;
  var regular  = rows.filter(function(r){ var dl=daysLeft(r.valor); return !isPendente(r.valor) && r.valor !== 'Desabilitado' && r.valor !== '' && (dl===null||dl>=0); }).length;
  var desab    = rows.filter(function(r){ return r.valor === 'Desabilitado'; }).length;

  document.getElementById('modalTitle').textContent = municipio;
  document.getElementById('modalSubtitle').textContent = 'Paraíba · ' + rows.length + ' atributos analisados';
  document.getElementById('modalSummary').innerHTML =
    '<div class="modal-stat"><span class="ms-val red">'    + issues   + '</span><span class="ms-lbl">Irregulares (!)</span></div>' +
    '<div class="modal-stat"><span class="ms-val" style="color:var(--orange)">' + vencidos + '</span><span class="ms-lbl">Vencidos</span></div>' +
    '<div class="modal-stat"><span class="ms-val green">'  + regular  + '</span><span class="ms-lbl">Regulares</span></div>' +
    '<div class="modal-stat"><span class="ms-val gray">'   + desab    + '</span><span class="ms-lbl">Desabilitados</span></div>';

  var html = '';
  GROUPS.forEach(function(g) {
    var gRows = rows.filter(function(r){ return r.atributo.indexOf(g.key) === 0; });
    if (!gRows.length) return;
    html += '<tr class="group-header"><td colspan="3">' + g.label + '</td></tr>';
    gRows.forEach(function(r) {
      var codeM = r.atributo.match(/^[\d.]+/);
      var code  = codeM ? codeM[0] : '';
      var label = r.atributo.replace(/^[\d.]+\s*[-—]\s*/, '');
      html += '<tr>' +
        '<td><span class="attr-code">' + esc(code) + '</span>' + esc(label) + '</td>' +
        '<td>' + statusBadge(r.valor) + '</td>' +
        '<td>' + prazoText(r.valor) + '</td>' +
        '</tr>';
    });
  });

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function bgClose(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

/* ── ATUALIZAR DADOS ── */
var toastTimer = null;
function toast(msg, tipo) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + tipo;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = ''; }, 6000);
}

function atualizarDados() {
  var btn = document.getElementById('btnUpdate');
  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = '⏳ Atualizando...';

  fetch('http://localhost:5001/ping')
    .then(function(r){ return r.json(); })
    .then(function() {
      toast('Conectado ao servidor. Buscando dados do banco...', 'ok');
      return fetch('http://localhost:5001/atualizar');
    })
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.ok) {
        toast('✔ Dashboard atualizado com sucesso! (' + data.registros + ' registros) — Recarregue a página em 1 minuto.', 'ok');
      } else {
        toast('⚠ Erro: ' + data.erro, 'err');
      }
    })
    .catch(function() {
      toast('❌ Servidor local não encontrado. Abra o iniciar_servidor.bat na sua máquina antes de atualizar.', 'err');
    })
    .finally(function() {
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.innerHTML = '&#8635; Atualizar Dados';
    });
}

/* ── init ── */
(function() {
  var fmt = function(d){ return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); };
  document.getElementById('updatedAt').innerHTML = 'Atualizado em<br><strong>' + fmt(new Date()) + '</strong>';
  document.getElementById('footerDate').textContent = fmt(new Date());
  renderKPIs();
  renderGrid();
})();
</script>
